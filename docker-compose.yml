version: "3.8"

services:
  backend:
    build: .
    container_name: rag_backend
    command: python app.py --backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./faiss_store:/app/faiss_store
    restart: unless-stopped

  frontend:
    build: .
    container_name: rag_frontend
    command: python app.py --frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
